[package]
name = "walrus-cli"
description = "The walrus command-line tool: inspect, extract, mutate, and convert .wal / .wbl archives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["wal", "cli", "history", "versioning", "document"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "walrus"
path = "src/main.rs"

[dependencies]
walrus-fmt = { workspace = true, features = ["diff", "search-regex"] }
wal-cli-common = { path = "../wal-cli-common", features = ["search-regex"] }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3"
