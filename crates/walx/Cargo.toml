[package]
name = "walx"
description = "Extract-only CLI over the walrus-fmt multi-file Archive API (extract + cat)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["wal", "cli", "history", "versioning", "document"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "walx"
path = "src/main.rs"

[dependencies]
walrus-fmt = { workspace = true, features = ["search-regex"] }
wal-cli-common = { path = "../wal-cli-common", features = ["search-regex"] }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3"
