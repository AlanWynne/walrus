[package]
name = "wal-cli-common"
description = "Shared internal CLI logic for the walrus command-line tools (walx, walrus)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
walrus-fmt = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
glob = "=0.3.3"

[features]
default = []
# Forwards the regex search mode to walrus-fmt so `--regex` is usable from the
# CLI binaries that enable it. Opt-in, so a default build of this crate (and a
# playback-only embedder) links neither `regex` nor the regex search arm
# (dependency boundary, invariant 2).
search-regex = ["walrus-fmt/search-regex"]
office = ["walrus-fmt/office"]

[dev-dependencies]
tempfile = "3"
