[package]
name = "walker"
description = "egui viewer and auto-player for .wal / .wbl files, with export and a CSV column viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["wal", "gui", "egui", "viewer", "player"]
categories = ["visualization", "gui"]

[[bin]]
name = "walker"
path = "src/main.rs"

[dependencies]
walrus-fmt = { workspace = true, features = ["export-all"] }
anyhow = { workspace = true }

# GUI stack. Pinned to a recent egui/eframe; adjust when first building.
eframe = "0.28"
egui = "0.28"
rfd = "0.14"            # native open/save file dialogs
