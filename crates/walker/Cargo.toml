[package]
name = "walker"
description = "egui viewer and auto-player for .wal / .wbl files, with export and a CSV column viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["wal", "gui", "egui", "viewer", "player"]
categories = ["visualization", "gui"]

[[bin]]
name = "walker"
path = "src/main.rs"

[dependencies]
walrus-fmt = { workspace = true, features = ["export-all"] }
anyhow = { workspace = true }

# GUI stack. Pinned to egui/eframe 0.36 (raised the workspace MSRV to 1.95).
eframe = "0.36"
egui = "0.36"
rfd = "0.14"            # native open/save file dialogs

[dev-dependencies]
# Headless GUI test harness. Default (egui) harness drives a Ui closure; the
# eframe feature is not needed for the transport-control harness tests.
egui_kittest = "0.36"
