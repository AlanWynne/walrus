[package]
name = "walker"
description = "egui viewer and auto-player for .wal / .wbl files, with export and a CSV column viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["wal", "gui", "egui", "viewer", "player"]
categories = ["visualization", "gui"]

[[bin]]
name = "walker"
path = "src/main.rs"

[features]
# FR-K5 import byte-mutation. OFF by default because it needs the `walrus_fmt`
# mutate API (`Archive::add`/`update`, FR-W7), a cross-stream dependency not yet
# merged on this branch. The import RESOLUTION, picker seam, prompt state, and
# WalrusSource orchestration are built and headless-tested WITHOUT this feature;
# flipping it on (once FR-W7 lands) wires `WalrusSource::import` to the real
# transactional mutate and un-ignores the on-disk import tests in tests/import.rs.
import-mutate = []

[dependencies]
walrus-fmt = { workspace = true, features = ["export-all"] }
anyhow = { workspace = true }

# GUI stack. Pinned to egui/eframe 0.36 (raised the workspace MSRV to 1.95).
eframe = "0.36"
egui = "0.36"
rfd = "0.14"            # native open/save file dialogs
# egui_extras supplies TableBuilder (unconditional -- NO `table` feature) for the
# CSV grid and the `syntax_highlighting` module for the Code view. Same 0.36 minor
# as egui/eframe so the GUI stack cannot drift.
#
# NOTE (design finding 2 -- version-sensitive API confirmed against the pinned
# 0.36 crate): egui_extras 0.36 has NO `syntax_highlighting` cargo feature (the
# design named one that does not exist). The `syntax_highlighting` module and
# `TableBuilder` are BOTH unconditional, so no `features` are needed. The
# optional `syntect` feature only upgrades highlight quality; the built-in
# fallback (okish for C/C++/Rust/Python, monospace otherwise) matches design 2.5
# which defers the syntect upgrade. The confirmed `highlight(..)` arity is
# recorded in src/view/code.rs.
egui_extras = { version = "0.36", default-features = false }
# Viewer-side Markdown and CSV parsing. Pinned to the SAME minors as the
# walrus-fmt exporter (pulldown-cmark 0.11, csv 1.3) so "what is shown is what is
# exported".
pulldown-cmark = "0.11"
csv = "1.3"
serde_json = { workspace = true }

[dev-dependencies]
# Headless GUI test harness. Default (egui) harness drives a Ui closure; the
# eframe feature is not needed for the transport-control harness tests.
egui_kittest = "0.36"
# Temp dirs for the section 8 integration round-trip (on-disk export assertions)
# and the FR-K2 WalrusSource fixtures written to disk.
tempfile = "3"
# The FR-K2 integration test assembles real multi-file .wal/.wbl containers in
# memory (ustar tar + zstd) from the library's public manifest types, mirroring
# crates/walrus/tests/archive_read.rs, rather than hand-rolling container bytes.
tar = { workspace = true }
zstd = { workspace = true }
