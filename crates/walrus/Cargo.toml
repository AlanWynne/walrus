[package]
name = "walrus-fmt"
description = "The .wal / .wbl document-with-history format and reconstruct-to-version engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["wal", "history", "versioning", "document", "time-travel"]
categories = ["data-structures", "encoding"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }

# Optional export backends: pulled in only by their export-* feature so a
# playback-only embedder stays lean (dependency boundary, invariant 2).
pulldown-cmark = { version = "0.11", optional = true }
scraper = { version = "0.20", optional = true }
csv = { version = "1.3", optional = true }
# printpdf (not genpdf): genpdf 0.2 requires loading a TrueType font family from
# font FILES on disk at runtime; printpdf 0.7 uses the standard-14 built-in PDF
# fonts (Helvetica) with no external font file, so a GUI-free in-memory backend
# can emit a %PDF- document without bundling font binaries.
printpdf = { version = "0.7", optional = true }
docx-rs = { version = "0.4", optional = true }

# Optional diff engine (FR-W6): turns an old-vs-new text pair into byte-offset
# splices. Behind the `diff` feature so a playback-only embedder stays lean
# (dependency boundary, invariant 2). Minimal feature set: `text` is the diff
# core (zero transitive deps); `unicode` is REQUIRED for grapheme-cluster
# tokenising so char-level splits land on grapheme boundaries (AC2). We do NOT
# enable `bytes`, `inline`, `serde`, or `wasm32_web_time` -- none are needed and
# `bytes` would widen the surface for no gain. `default-features = false` keeps
# us from silently depending on anything beyond what is listed.
similar = { version = "2.7", optional = true, default-features = false, features = ["text", "unicode"] }

# Optional encoding transcoder (FR-W8): decode a declared source encoding into
# UTF-8 on the way in and re-encode on the way out. Behind the `i18n` feature so
# a playback-only embedder stays lean (dependency boundary, invariant 2).
encoding_rs = { version = "0.8", optional = true }

# Optional regex engine for the `--regex` search mode. Behind the `search-regex`
# feature so a playback-only embedder stays lean (dependency boundary,
# invariant 2), mirroring the `diff`/`i18n` opt-in pattern: `regex` is pure Rust
# with no GUI/app/ff-* dependency, so it does not breach the boundary, but it is
# opt-in so the default build links neither `regex` nor the regex search arm and
# `cargo tree` stays auditable. Minimal feature set: `std` + `unicode`; we do
# NOT pull the perf/transitive extras `default-features` would add.
regex = { version = "1", optional = true, default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
# For the example generators only; not part of the library's dependency graph.
anyhow = { workspace = true }
# Test-only: TempDir for round-trip and transactional-write tests (FR-W4).
# Already resolved at 3.27 via the workspace lockfile; a dev-dependency so it
# never enters the library's own dependency graph (invariant 2).
tempfile = "3"

[features]
default = []
# Export formats are opt-in so a playback-only embedder stays lean.
export-html = ["dep:pulldown-cmark", "dep:scraper"]
export-md = ["dep:pulldown-cmark"]
export-csv = ["dep:csv"]
export-json = [] # serde_json is already a non-optional dependency
export-pdf = ["dep:printpdf"]
export-docx = ["dep:docx-rs"]
export-all = ["export-html", "export-md", "export-csv", "export-json", "export-pdf", "export-docx"]
# The diff engine (FR-W6) is opt-in; it pulls `similar` only when enabled.
diff = ["dep:similar"]
# The i18n encoding path (FR-W8) is opt-in; it pulls `encoding_rs` only when
# enabled. The default build links neither `similar` nor `encoding_rs`.
i18n = ["dep:encoding_rs"]
# The regex search mode (`--regex`) is opt-in; it pulls `regex` only when
# enabled. The default build links neither `regex` nor the regex search arm, so
# literal + case-insensitive search stays dependency-free (invariant 2).
search-regex = ["dep:regex"]
